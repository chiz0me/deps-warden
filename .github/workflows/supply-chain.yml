name: supply-chain

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.18.0'
          # Node 24 currently bundles npm 11, but this project deliberately
          # enforces npm 12 through devEngines. Avoid setup-node invoking the
          # bundled npm while probing its automatic package-manager cache.
          package-manager-cache: false
      - name: Install pinned npm
        working-directory: /tmp
        run: npm install --global npm@12.0.2 --ignore-scripts
      - run: npm --version
      - run: npm ci
      # Dogfood the committed mandatory baseline. Missing git-backed evidence
      # is a gate failure rather than a clean result.
      - name: deps-warden gate
        run: |
          node src/cli.js audit --require-complete \
            >> "$GITHUB_STEP_SUMMARY"
